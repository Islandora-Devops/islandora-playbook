---
name: Ansible CI

"on":
  push:
  workflow_dispatch:

env:
  ANSIBLE_CONFIG: ansible.cfg
  ANSIBLE_COLLECTIONS_PATH: collections
  ANSIBLE_FORCE_COLOR: "1"
  ANSIBLE_ROLES_PATH: roles/external:roles/internal
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PY_COLORS: "1"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.16,<2.18" "ansible-lint>=24.2,<25" "pre-commit>=4,<5" "yamllint>=1.35,<2" "molecule>=24.2,<25"

      - name: Install Galaxy roles
        run: ansible-galaxy role install -r requirements.yml -p roles/external

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements-ci.yml -p collections

      - name: Run lint
        run: ./scripts/run-lint --all-files

  molecule:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.16,<2.18" "ansible-lint>=24.2,<25" "molecule>=24.2,<25"

      - name: Install Galaxy roles
        run: ansible-galaxy role install -r requirements.yml -p roles/external

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements-ci.yml -p collections

      - name: Run Molecule smoke test
        run: molecule test
